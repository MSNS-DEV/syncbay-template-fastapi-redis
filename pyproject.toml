[project]
name = "syncbay-template-fastapi-redis"
version = "1.0.0"
description = "Notes REST API with FastAPI, PostgreSQL and Redis, plus a small web UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "email-validator==2.4.0",
    "fastapi==0.165.0",
    "httptools==0.9.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pyjwt==2.15.1",
    "redis==8.2.0",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "C4", "PT"]
# S105/S106 flag every `token_type=`/`password=` keyword; secrets come only from env here.
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
