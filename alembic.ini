# Alembic configuration. The database URL comes from DATABASE_URL (see migrations/env.py).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = {"level":"%(levelname)s","logger":"%(name)s","msg":"%(message)s"}
