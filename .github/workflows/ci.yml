name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -p tpl-fastapi-redis -f compose.yaml -f compose.test.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-hashes -q > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip

      - name: Docker build
        run: docker build -t syncbay-template-fastapi-redis:local .

      - name: Start the stack
        run: $COMPOSE up -d --no-build --wait

      - name: API tests (against the compose Postgres and Redis)
        run: uv run pytest tests/api -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: e2e
        run: npm test

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
